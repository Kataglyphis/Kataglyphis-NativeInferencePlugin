group = "com.example.kataglyphis_native_inference"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.kataglyphis_native_inference"

    compileSdk = 36

    // Both are pinned for the same reason: without them the Android Gradle
    // Plugin falls back to its own defaults (NDK 27.0.12077973, build-tools
    // 35.0.0 for AGP 8.11.1), which the CI image does not ship. Its
    // /opt/android-sdk is read-only, so Gradle cannot install them and dies
    // with "The SDK directory is not writable". Keep both equal to the app's.
    buildToolsVersion = "36.0.0"
    ndkVersion = "29.0.14206865"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            // Without a version AGP asks for its default (cmake;3.22.1), which
            // the read-only /opt/android-sdk of the CI image does not ship —
            // it carries 4.1.2. Same rule as buildToolsVersion/ndkVersion.
            version "4.1.2"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26

        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"

                def gstreamerRootAndroid = System.getenv("GSTREAMER_ROOT_ANDROID")
                if (!gstreamerRootAndroid && project.hasProperty("gstreamerRootAndroid")) {
                    gstreamerRootAndroid = project.property("gstreamerRootAndroid")
                }
                if (gstreamerRootAndroid) {
                    arguments "-DGSTREAMER_ROOT_ANDROID=${gstreamerRootAndroid}"
                }
            }
        }

        ndk {
            // Nur noch arm64-v8a für moderne Android-Geräte
            abiFilters "arm64-v8a"
        }
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
